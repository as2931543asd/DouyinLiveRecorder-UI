[project]
name = "DouyinLiveRecorder"
version = "4.0.7"
description = "可循环值守和多人录制的抖音直播录制软件"
readme = "README.md"
authors = [{name = "Hmily"}]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "httpx[http2]>=0.28.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "psutil>=5.9.0"
]

[project.urls]
"Homepage" = "https://github.com/as2931543asd/DouyinLiveRecorder-UI"
"Documentation" = "https://github.com/as2931543asd/DouyinLiveRecorder-UI"
"Repository" = "https://github.com/as2931543asd/DouyinLiveRecorder-UI"
"Issues" = "https://github.com/as2931543asd/DouyinLiveRecorder-UI/issues"
